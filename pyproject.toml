[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pkg-batch-extractor"
version = "1.0.0"
description = "Lightweight multi-PKG extraction desktop interface"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []
keywords = ["ps4", "pkg", "gui", "batch", "extractor"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Utilities",
]

[project.gui-scripts]
pkg-batch-extractor = "pkg_batch_extractor.ui:main"

[tool.setuptools.packages.find]
where = ["src"]
